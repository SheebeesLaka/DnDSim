<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A — Chronicle (DM screen mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --win-top: #2b3878; --win-mid: #1a2253; --win-bot: #0f1538;
    --gold: #e2c172; --gold-dim: #a68a4a; --ink: #f3ecd9; --ink-2: #c9c0a8; --ink-3: #8e8a9e;
    --party: #8fd88a; --enemy: #ec6a5c; --boss: #ff9b5a; --buff: #ffd86b; --debuff: #b99cff; --dot: #ff8a4c;
    --hp-lo: #f0b44a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1536px; height: 960px; overflow: hidden; background: #070a12; }
  body { font-family: 'Alegreya Sans', system-ui, sans-serif; color: var(--ink); position: relative; }
  .board { position: absolute; left: 0; top: -56px; width: 1536px; height: 960px;
    background: url(../scene/board-full-1920x1200.png) 0 0 / 1536px 960px no-repeat; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(7,10,18,0) 62%, rgba(7,10,18,.78) 86%, rgba(7,10,18,.95) 100%),
                linear-gradient(90deg, rgba(7,10,18,.65) 0%, rgba(7,10,18,0) 22%); }

  /* ---- FFT-style window ---- */
  .win { position: absolute; border-radius: 6px;
    background: linear-gradient(180deg, var(--win-top), var(--win-mid) 55%, var(--win-bot));
    box-shadow: 0 0 0 1px #05071a, inset 0 0 0 2px var(--gold-dim), inset 0 0 0 3px #0b0f2c,
                inset 0 1px 0 4px rgba(255,255,255,.06), 0 10px 28px rgba(0,0,0,.55); }
  .win::before, .win::after { content: ''; position: absolute; width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3c4, var(--gold) 45%, #6d5524); top: 6px; }
  .win::before { left: 6px; } .win::after { right: 6px; }
  .cap { font-family: Cinzel, serif; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    font-size: 11px; color: var(--gold); }
  .num { font-family: Cinzel, serif; font-weight: 700; font-variant-numeric: lining-nums tabular-nums; }
  .key { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 3px;
    font: 700 11px/1 'Alegreya Sans'; color: #1a1630; background: linear-gradient(#f6e7b8, #cfb26a);
    box-shadow: 0 1px 0 #6d5524; }
  .ico { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; }
  .ico svg { width: 100%; height: 100%; display: block; }

  /* ---- round plaque ---- */
  .plaque { left: 16px; top: 14px; width: 258px; height: 66px; padding: 10px 18px; }
  .plaque .r { font-family: Cinzel, serif; font-weight: 700; font-size: 26px; letter-spacing: .08em; line-height: 1; }
  .plaque .r small { font-size: 13px; color: var(--gold); letter-spacing: .2em; margin-right: 6px; }
  .plaque .sub { font-size: 13px; color: var(--ink-2); margin-top: 6px; display: flex; gap: 10px; align-items: center; }
  .moon { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset -3px -1px 0 0 #c9c0a8; display: inline-block; }

  /* ---- AT list ---- */
  .at { left: 16px; top: 92px; width: 238px; padding: 14px 10px 10px; }
  .at .cap { padding: 0 8px 8px; display: flex; justify-content: space-between; }
  .at-row { position: relative; display: grid; grid-template-columns: 34px 1fr 30px; gap: 8px; align-items: center;
    height: 46px; padding: 0 8px; border-radius: 4px; }
  .at-row + .at-row { margin-top: 2px; }
  .at-row .face { width: 34px; height: 34px; border-radius: 3px; overflow: hidden; position: relative;
    background: radial-gradient(circle at 50% 30%, #3b4a8f, #141a40); box-shadow: inset 0 0 0 1px rgba(226,193,114,.45); }
  .at-row .face img { position: absolute; width: 30px; left: 2px; top: 2px; image-rendering: pixelated; }
  .at-row .face .gl { position: absolute; inset: 0; display: grid; place-items: center; font: 800 12px 'Alegreya Sans'; color: #ffd9a8; background: #6b3a14; }
  .at-row .nm { font-weight: 700; font-size: 14px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .at-row .nm.enemy { color: #ffc4bb; } .at-row .nm.party { color: #d7f5d0; }
  .at-row .bar { height: 4px; border-radius: 2px; background: rgba(0,0,0,.5); margin-top: 4px; overflow: hidden; }
  .at-row .bar i { display: block; height: 100%; }
  .at-row .st { position: absolute; left: 50px; bottom: 3px; display: flex; gap: 3px; }
  .at-row .ini { text-align: right; font-size: 15px; color: var(--gold); }
  .at-row.now { background: linear-gradient(90deg, rgba(226,193,114,.32), rgba(226,193,114,.06));
    box-shadow: inset 0 0 0 1px rgba(226,193,114,.7); }
  .at-row.now::before { content: ''; position: absolute; left: -16px; top: 15px; border: 8px solid transparent;
    border-left: 10px solid var(--gold); filter: drop-shadow(0 0 4px rgba(226,193,114,.8)); }
  .at-row.done { opacity: .5; }
  .at-row.ready .ini { font-size: 10px; letter-spacing: .06em; color: var(--debuff); }
  .sicon { width: 15px; height: 15px; border-radius: 3px; display: grid; place-items: center; color: #10112a; }
  .sicon svg { width: 11px; height: 11px; }
  .sicon.buff { background: var(--buff); } .sicon.debuff { background: var(--debuff); } .sicon.dot { background: var(--dot); }
  .at-sep { margin: 8px 8px 4px; display: flex; align-items: center; gap: 8px; color: var(--ink-3); font: 700 10px Cinzel; letter-spacing: .16em; }
  .at-sep::before, .at-sep::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); }
  .at-row.ghost { border: 1px dashed rgba(236,106,92,.55); background: rgba(236,106,92,.06); }
  .at-row.ghost .nm { color: #ffb4a9; font-style: italic; }
  .at-foot { padding: 8px 8px 0; font-size: 11.5px; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---- command menu ---- */
  .cmd { left: 270px; top: 436px; width: 186px; padding: 14px 8px 10px; }
  .cmd .cap { padding: 0 10px 6px; }
  .cmd-row { position: relative; display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 10px 0 30px;
    font-weight: 700; font-size: 15.5px; border-radius: 3px; color: var(--ink); }
  .cmd-row .key { position: absolute; left: 6px; }
  .cmd-row .r { margin-left: auto; color: var(--ink-3); font-size: 12px; font-weight: 500; }
  .cmd-row.on { background: linear-gradient(90deg, rgba(255,255,255,.18), rgba(255,255,255,.02)); }
  .cmd-row.dim { color: var(--ink-3); }
  .hand { position: absolute; left: -30px; top: 6px; width: 30px; height: 18px; }
  .sub-menu { left: 462px; top: 490px; width: 168px; padding: 12px 8px 8px; }
  .cmd-hr { height: 1px; margin: 6px 10px; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); }

  /* ---- bottom plates ---- */
  .plate { top: 724px; height: 222px; width: 428px; padding: 16px 18px; display: grid; grid-template-columns: 112px 1fr; gap: 16px; }
  .plate.me { left: 16px; } .plate.them { right: 16px; grid-template-columns: 1fr 112px; text-align: right; }
  .portrait { width: 112px; height: 150px; border-radius: 4px; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, #46559f, #151b45 70%); box-shadow: inset 0 0 0 2px var(--gold-dim), inset 0 0 0 3px #0b0f2c; }
  .portrait img { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: 80px; image-rendering: pixelated; }
  .plate.them .portrait { order: 2; background: radial-gradient(ellipse at 50% 35%, #8f3f46, #3a1420 70%); }
  .plate.them .portrait img { transform: translateX(-50%) scaleX(-1); }
  .side-tag { position: absolute; left: 0; right: 0; bottom: 0; font: 700 10px Cinzel; letter-spacing: .16em; padding: 3px 0;
    text-align: center; background: rgba(0,0,0,.55); }
  .pname { font-family: Cinzel, serif; font-weight: 700; font-size: 21px; letter-spacing: .03em; line-height: 1.05; }
  .pcls { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
  .hpline { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
  .plate.them .hpline { justify-content: flex-end; }
  .hpline .lbl { font: 700 12px Cinzel; color: var(--gold); letter-spacing: .1em; }
  .hpline .v { font-size: 30px; line-height: 1; }
  .hpline .v small { font-size: 16px; color: var(--ink-2); }
  .hpbar { position: relative; height: 10px; border-radius: 5px; background: #090b20; margin-top: 6px;
    box-shadow: inset 0 0 0 1px rgba(226,193,114,.35); overflow: hidden; }
  .hpbar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; }
  .hpbar .loss { background: repeating-linear-gradient(135deg, #ff6a5a 0 5px, #b8323a 5px 10px); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .pstats { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
  .plate.them .pstats { justify-content: flex-end; }
  .pstats b { font-family: Cinzel; font-size: 17px; color: var(--ink); margin-left: 4px; }
  .pstats .adj { color: var(--buff); font-size: 12px; }
  .chips { display: flex; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
  .plate.them .chips { justify-content: flex-end; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 4px; border-radius: 12px;
    font-size: 13px; font-weight: 700; background: rgba(0,0,0,.35); }
  .chip .sicon { width: 17px; height: 17px; border-radius: 50%; }
  .chip .t { font-family: Cinzel; color: var(--ink-2); font-size: 12px; }
  .chip.buff { box-shadow: inset 0 0 0 1px rgba(255,216,107,.6); } .chip.dot { box-shadow: inset 0 0 0 1px rgba(255,138,76,.7); }

  /* ---- forecast ---- */
  .fc { left: 460px; top: 688px; width: 616px; height: 258px; padding: 14px 20px 12px; }
  .fc-head { display: flex; align-items: center; gap: 12px; }
  .fc-head .who { font-family: Cinzel; font-weight: 700; font-size: 16px; letter-spacing: .04em; }
  .fc-head .who em { font-style: normal; color: var(--gold); margin: 0 8px; }
  .fc-head .wpn { margin-left: auto; font-size: 13px; color: var(--ink-2); }
  .eq { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .die { width: 56px; height: 56px; position: relative; display: grid; place-items: center; }
  .die svg { position: absolute; inset: 0; }
  .die .n { position: relative; font-family: Cinzel; font-weight: 700; font-size: 25px; color: #1a1630; }
  .die .tag { position: absolute; bottom: -15px; left: 0; right: 0; text-align: center; font: 700 10px Cinzel; color: var(--gold); letter-spacing: .1em; }
  .op { font-family: Cinzel; font-size: 20px; color: var(--gold); }
  .term { text-align: center; line-height: 1; }
  .term .v { font-family: Cinzel; font-weight: 700; font-size: 25px; }
  .term .k { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
  .term.buff .v { color: var(--buff); }
  .vs { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .total { font-family: Cinzel; font-weight: 700; font-size: 38px; line-height: 1; text-shadow: 0 0 12px rgba(226,193,114,.5); }
  .ac { text-align: center; padding: 4px 10px; border-radius: 4px; background: rgba(0,0,0,.35); }
  .ac .v { font-family: Cinzel; font-weight: 700; font-size: 22px; } .ac .k { font-size: 10.5px; color: var(--ink-2); letter-spacing: .1em; }
  .ladder-wrap { position: relative; margin-top: 20px; }
  .ladder { position: relative; display: grid; grid-template-columns: 1fr 1.25fr .75fr 1fr; height: 22px; border-radius: 3px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(226,193,114,.35); }
  .ladder div { display: grid; place-items: center; font: 700 11px Cinzel; letter-spacing: .1em; color: var(--ink-3); background: rgba(0,0,0,.35); }
  .ladder div + div { border-left: 1px solid rgba(226,193,114,.25); }
  .ladder .hit { color: #1a1630; background: linear-gradient(#ffe7a1, #d9b25a); }
  .ladder-mark { position: absolute; top: -11px; z-index: 2; filter: drop-shadow(0 0 4px #fff); width: 0; height: 0; border: 7px solid transparent; border-top-color: #fff; }
  .ladder-note { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-top: 5px; }
  .dmg { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 16px; border-top: 1px solid rgba(226,193,114,.22); }
  .dmg .lbl { font: 700 11px Cinzel; letter-spacing: .14em; color: var(--gold); width: 64px; }
  .d6 { width: 40px; height: 40px; border-radius: 7px; display: grid; place-items: center; font-family: Cinzel; font-weight: 700; font-size: 20px;
    color: #1a1630; background: linear-gradient(#fff8e0, #e6d3a0); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 2px 0 #6d5524; position: relative; }
  .d6.typing { background: linear-gradient(#ffffff, #f4e9c9); box-shadow: 0 0 0 2px var(--gold), 0 0 14px rgba(226,193,114,.75); }
  .d6.typing::after { content: ''; position: absolute; right: 9px; top: 10px; bottom: 10px; width: 2px; background: #1a1630; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .d6 small { position: absolute; top: -13px; font: 700 9.5px Cinzel; color: var(--ink-3); letter-spacing: .08em; }
  .res { margin-left: auto; text-align: right; }
  .res .v { font-family: Cinzel; font-weight: 700; font-size: 34px; line-height: 1; color: #ff8f80; text-shadow: 0 0 12px rgba(236,106,92,.5); }
  .res .k { font-size: 12.5px; color: var(--ink-2); }
  .fc-keys { position: absolute; right: 20px; top: 14px; display: none; }
  .fc-foot { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); margin-top: 8px; }

  /* ---- field window (lighting / terrain) ---- */
  .field { right: 16px; top: 14px; width: 300px; padding: 14px 16px 12px; }
  .field .cap { display: flex; justify-content: space-between; align-items: center; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 10px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(226,193,114,.4); }
  .seg div { text-align: center; padding: 5px 0; font-weight: 700; font-size: 13px; color: var(--ink-2); }
  .seg div + div { border-left: 1px solid rgba(226,193,114,.25); }
  .seg .on { color: #1a1630; background: linear-gradient(#ffe7a1, #d9b25a); }
  .lamp { display: flex; align-items: center; gap: 10px; height: 32px; margin-top: 4px; font-size: 14px; font-weight: 700; }
  .lamp .bulb { width: 14px; height: 14px; border-radius: 50%; }
  .lamp .sub { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
  .lamp .sw { margin-left: auto; width: 38px; height: 20px; border-radius: 10px; background: #0a0d26; box-shadow: inset 0 0 0 1px rgba(226,193,114,.4); position: relative; }
  .lamp .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #5a5873; transition: left .2s; }
  .lamp .sw.on { background: linear-gradient(90deg, #6d5524, #a8853e); }
  .lamp .sw.on::after { left: 21px; background: #fff3c4; box-shadow: 0 0 8px #ffe7a1; }
  .lamp.off { color: var(--ink-3); }
  .field-foot { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(226,193,114,.22); }
  .fbtn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 5px; border-radius: 4px; font-size: 11.5px; font-weight: 700; color: var(--ink-2);
    background: rgba(0,0,0,.28); }
  .fbtn .ico { width: 17px; height: 17px; color: var(--gold); }
  .fbtn .key { margin-top: 1px; min-width: 16px; height: 15px; font-size: 10px; }

  .tile { right: 16px; top: 336px; width: 220px; padding: 12px 14px; }
  .tile .row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 4px; color: var(--ink-2); }
  .tile .row b { color: var(--ink); }
  .tile .h { font-family: Cinzel; font-weight: 700; font-size: 30px; line-height: 1; }
  .tile .h small { font-size: 12px; color: var(--ink-2); margin-left: 4px; }

  /* ---- on-board markers ---- */
  .mk { position: absolute; transform: translate(-50%, -100%); pointer-events: none; }
  .crystal { width: 22px; height: 30px; animation: bob 1.4s ease-in-out infinite; filter: drop-shadow(0 0 8px rgba(255,216,107,.9)); }
  @keyframes bob { 50% { transform: translate(-50%, calc(-100% - 6px)); } }
  .tgt { width: 34px; height: 30px; animation: bob 0.9s ease-in-out infinite; filter: drop-shadow(0 0 6px rgba(236,106,92,.9)); }
  .bstat { display: flex; gap: 3px; padding: 3px 4px; border-radius: 10px; background: rgba(9,12,34,.82); box-shadow: inset 0 0 0 1px rgba(226,193,114,.45); }
  .bstat .sicon { width: 16px; height: 16px; border-radius: 50%; }
  .bstat .sicon b { font: 800 9px 'Alegreya Sans'; margin-left: 1px; }
  .floatdmg { font-family: Cinzel; font-weight: 700; font-size: 26px; color: #ffb0a5; text-shadow: 0 2px 0 #3a0e14, 0 0 14px rgba(236,106,92,.8); }
  .floatdmg small { font-size: 13px; color: var(--ink); text-shadow: 0 1px 0 #000; display: block; text-align: center; }
  .fly { font: 700 11px 'Alegreya Sans'; padding: 1px 7px; border-radius: 9px; background: rgba(9,12,34,.85); color: #bfe3ff; box-shadow: inset 0 0 0 1px rgba(191,227,255,.5); }
  .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 248px; font-size: 12.5px; color: var(--ink-2); display: none; }
</style>
</head>
<body>
<div class="board"></div>
<div class="vignette"></div>
<div id="ui"></div>

<script src="scene-data.js"></script>
<script>
const S = window.SCENE, I = S.ICON, $ = (h) => h;
const ui = document.getElementById('ui');
const DY = -56;
const hpColor = (u) => u.hp / u.max > .5 ? (u.side === 'enemy' ? 'var(--enemy)' : 'var(--party)') : u.hp / u.max > .25 ? 'var(--hp-lo)' : '#ff5a4d';
const face = (u) => u.portrait ? `<img src="${u.portrait}">` : `<div class="gl">${u.glyph}</div>`;
const sicon = (s, withT) => `<span class="sicon ${s.k}" title="${s.n}">${I[s.icon]}${withT ? `<b>${s.t}</b>` : ''}</span>`;
const glove = `<svg class="hand" viewBox="0 0 30 18"><path d="M1 7h14l-3-4c-.6-.9.6-2 1.4-1.3L20 6h7a2 2 0 012 2v4a2 2 0 01-2 2h-1a2 2 0 01-2 2h-9a3 3 0 01-3-3H1a2 2 0 01-2-2v-1a2 2 0 012-2z" fill="#fff" stroke="#3a2d10" stroke-width="1.4"/></svg>`;

// round plaque
let html = `
<div class="win plaque">
  <div class="r"><small>Round</small>3</div>
  <div class="sub"><span><span class="moon"></span> ${S.area}</span><span>· Dim light</span></div>
</div>`;

// AT list
const order = S.units;
html += `<div class="win at"><div class="cap"><span>Turn Order</span><span style="color:var(--ink-3)">Init</span></div>`;
order.forEach((u, i) => {
  const cls = [u.current ? 'now' : '', i < 1 ? 'done' : '', u.readied ? 'ready' : ''].join(' ');
  html += `<div class="at-row ${cls}">
    <div class="face">${face(u)}</div>
    <div><div class="nm ${u.side}">${u.boss ? '♛ ' : ''}${u.short}</div>
      <div class="bar"><i style="width:${u.hp / u.max * 100}%;background:${hpColor(u)}"></i></div></div>
    <div class="ini num">${u.readied ? 'READY' : u.init}</div>
    ${u.statuses.length ? `<div class="st">${u.statuses.map((s) => sicon(s)).join('')}</div>` : ''}
  </div>`;
});
html += `<div class="at-sep">Round 4</div>
  <div class="at-row ghost"><div class="face"><div class="gl" style="background:#2f5a2f;color:#cfe8c0">FX</div></div>
    <div><div class="nm">Falsiradix ×2</div><div style="font-size:11px;color:var(--ink-3)">arrive · east vent</div></div><div class="ini num" style="color:var(--ink-3)">?</div></div>
  <div class="at-foot"><span><span class="key">Alt</span> <span class="key">↑↓</span> reorder</span><span><span class="key">D</span> delay</span><span><span class="key">Y</span> ready</span></div>
</div>`;

// command menu (FFT list) + Act submenu
html += `<div class="win cmd"><div class="cap">Henry</div>
  <div class="cmd-row"><span class="key">1</span>Move<span class="r">2 tiles</span></div>
  <div class="cmd-row on"><span class="key">2</span>Act<span class="r">▸</span></div>
  <div class="cmd-row"><span class="key">3</span>Status</div>
  <div class="cmd-row"><span class="key">4</span>Adjust HP</div>
  <div class="cmd-hr"></div>
  <div class="cmd-row"><span class="key">␣</span>End turn</div>
  <div class="cmd-row dim"><span class="key">D</span>Delay</div>
</div>
<div class="win sub-menu"><div class="cap" style="padding:0 10px 6px">Act</div>
  <div class="cmd-row on" style="padding-left:30px">${glove}<span class="key">E</span>Attack</div>

  <div>

    <div class="pcls">${me.cls} · Lv ${me.lvl} · <span style="color:var(--ink)">${me.weapon}</span></div>
    <div class="hpline"><span class="lbl">HP</span><span class="v num">${me.hp}<small>/${me.max}</small></span></div>
    <div class="hpbar"><i style="width:${me.hp / me.max * 100}%;background:linear-gradient(90deg,#4f9c4c,var(--party))"></i></div>
    <div class="pstats"><span>AC<b>14</b></span><span>MOB<b>2</b></span><span>ATK<b>+9</b> <span class="adj">(+2)</span></span></div>
    <div class="chips">${me.statuses.map((s) => `<span class="chip ${s.k}">${sicon(s)}${s.n} <span class="t">${s.fx} · ${s.t}r</span></span>`).join('')}</div>
  </div>
</div>
<div class="win plate them">
  <div class="portrait"><img src="${them.portrait}"><div class="side-tag" style="color:var(--enemy)">TARGET</div></div>

    <div class="hpbar"><i style="width:100%;background:var(--enemy)"></i><i class="loss" style="left:${A.hpAfter / them.max * 100}%;right:0;width:auto"></i></div>
    <div class="pstats"><span>AC<b>12</b></span><span>MOB<b>3</b></span><span>DEX save<b>+3</b></span></div>
    <div class="chips">${them.statuses.map((s) => `<span class="chip ${s.k}">${sicon(s)}${s.n} <span class="t">${s.fx} · ${s.t}r</span></span>`).join('')}</div>
  </div>
</div>`;

// forecast
const d20 = `<svg viewBox="0 0 56 56"><polygon points="28,2 52,15 52,41 28,54 4,41 4,15" fill="url(#gg)" stroke="#6d5524" stroke-width="2"/>
  <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d8"/><stop offset="1" stop-color="#d9bd78"/></linearGradient></defs></svg>`;
html += `
<div class="win fc">
  <div class="fc-head"><span class="cap">Forecast</span><span class="who">Henry <em>⟶</em> Guard #1</span><span class="wpn">Sledgehammer · d6 / d6 / d10</span></div>
  <div class="eq">
    <div class="die">${d20}<span class="n">${A.d20}</span><span class="tag">D20</span></div>
    <span class="op">+</span><div class="term"><div class="v">7</div><div class="k">STR</div></div>
    <span class="op">+</span><div class="term buff"><div class="v">2</div><div class="k">Blessed</div></div>
    <span class="op">=</span><div class="total">${A.total}</div>
    <div class="vs"><span class="op" style="font-size:14px">vs</span><div class="ac"><div class="v">12</div><div class="k">AC</div></div>
      <div class="term" style="margin-left:6px"><div class="v" style="color:var(--buff)">+${A.margin}</div><div class="k">margin</div></div></div>
  </div>
  <div class="ladder-wrap"><div class="ladder">
    <div>MISS &lt;0</div><div>T1 · 0–4</div><div class="hit">T2 · 5–7</div><div>T3 · 8+</div></div>
    <span class="ladder-mark" style="left:calc(${(1 + 1.25 + .75 * (1.5 / 3)) / 4 * 100}% - 7px)"></span>
  </div>
  <div class="ladder-note"><span>Nat 20 hits ×1.5</span><span style="color:var(--buff)">2 short of Tier 3</span></div>
  <div class="dmg">
    <span class="lbl">Damage</span>
    <div class="d6"><small>T1 d6</small>4</div><span class="op">+</span>
    <div class="d6 typing"><small>T2 d6</small>5</div><span class="op">+</span>
    <div class="term"><div class="v">5</div><div class="k">STR ½</div></div>
    <div class="res"><div class="v">14</div><div class="k">Guard #1 · 18 → 4</div></div>
  </div>

// field window: lighting + terrain tools
const L = S.lighting;
html += `

  <div class="cap"><span>Field</span><span style="color:var(--ink-3)"><span class="key">Tab</span></span></div>
  <div class="seg"><div>Bright</div><div class="on">Dim</div><div>Dark</div></div>
  ${L.lights.map((l) => `<div class="lamp ${l.on ? '' : 'off'}">
    <span class="bulb" style="background:${l.on ? l.color : '#2a2c44'};box-shadow:${l.on ? `0 0 10px ${l.color}` : 'inset 0 0 0 1px #5a5873'}"></span>
    <div>${l.name}<div class="sub">${l.group ? `group · ${l.count} light${l.count > 1 ? 's' : ''}` : `carried by ${l.carried}`}${l.note ? ' · ' + l.note : ''}</div></div>
    <span class="sw ${l.on ? 'on' : ''}"></span></div>`).join('')}
  <div class="field-foot">
    <div class="fbtn"><span class="ico">${I.lamp}</span>Light<span class="key">L</span></div>
    <div class="fbtn"><span class="ico">${I.height}</span>Height<span class="key">H</span></div>
    <div class="fbtn"><span class="ico">${I.spawn}</span>Units<span class="key">U</span></div>
    <div class="fbtn"><span class="ico">${I.tv}</span>TV<span class="key">V</span></div>

</div>

  <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px">
    <div class="h">0<small>ft</small></div><div style="font-size:13px;color:var(--ink-2);text-align:right">Moss-grown deck<br>Torchlight · bright</div></div>
  <div class="row"><span>Cover</span><b>none</b></div>
</div>`;

// board markers
const P = (id) => S.pos('full', id, 0, DY);
const h1 = P('u1'), g1 = P('u5');
html += `<svg class="mk crystal" style="left:${h1.x}px;top:${h1.head - 8}px" viewBox="0 0 22 30"><polygon points="11,0 22,10 11,30 0,10" fill="#ffe08a" stroke="#8a6a20" stroke-width="1.5"/><polygon points="11,0 16,10 11,30" fill="#fff6c8" opacity=".7"/></svg>`;
html += `<svg class="mk tgt" style="left:${g1.x}px;top:${g1.head - 4}px" viewBox="0 0 34 30"><path d="M17 30L2 6h30z" fill="#ff7a6a" stroke="#5a1a1a" stroke-width="2"/><path d="M17 22L9 9h16z" fill="#ffd0c8" opacity=".6"/></svg>`;
html += `<div class="mk floatdmg" style="left:${g1.x + 52}px;top:${g1.head + 6}px">−14<small>18 → 4</small></div>`;
for (const u of S.units) {
  if (!u.statuses.length) continue;
  const p = P(u.id);
  const [ox, oy] = { u1: [-34, 34], u5: [0, -40], u7: [0, -10], u3: [-46, 40], u2: [0, -6] }[u.id] ?? [0, -6];
  html += `<div class="mk bstat" style="left:${p.x + ox}px;top:${p.head + oy}px">${u.statuses.map((s) => sicon(s, true)).join('')}</div>`;
}
const hn = P('u7');
html += `<div class="mk fly" style="left:${hn.x + 44}px;top:${hn.head + 26}px">▲ 15 ft</div>`;

ui.innerHTML = html;
</script>
</body>
</html>
